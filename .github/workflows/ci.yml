name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests
      - name: manifest versions agree
        run: |
          a=$(jq -r .version .claude-plugin/plugin.json); b=$(jq -r .version .codex-plugin/plugin.json)
          [ "$a" = "$b" ] || { echo "version mismatch: $a vs $b"; exit 1; }
